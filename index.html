<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro y Álbumes de Música</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light">

    <div class="container my-5">
        <h1 class="text-center mb-5 fw-bold">Mi Colección Musical</h1>

        <div class="row g-4">
            <!-- COLUMNA IZQUIERDA: FORMULARIO -->
            <div class="col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="card-title mb-4 text-primary">Agregar Nuevo Álbum</h3>

                        <form id="album-form" class="needs-validation" novalidate>
                            <!-- 1. Título -->
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título del álbum</label>
                                <input name="title" type="text" class="form-control" id="titulo"
                                    placeholder="Ej. Thriller" required>
                            </div>

                            <!-- 2. Artista -->
                            <div class="mb-3">
                                <label for="artista" class="form-label">Artista / Banda</label>
                                <input name="artist" type="text" class="form-control" id="artista"
                                    placeholder="Ej. Michael Jackson" required>
                            </div>

                            <!-- 3. Año de lanzamiento -->
                            <div class="mb-3">
                                <label for="anio" class="form-label">Año de lanzamiento</label>
                                <input name="year" type="number" class="form-control" id="anio" placeholder="Ej. 1982"
                                    min="1900" max="2099" required>
                            </div>

                            <!-- 4. Género -->
                            <div class="mb-3">
                                <label for="genre" class="form-label">Género</label>
                                <input name="genre" type="text" class="form-control" id="genre" placeholder="Ej. Rock"
                                    required>
                            </div>

                            <!-- 5. Calificación -->
                            <div class="mb-3">
                                <label for="rating" class="form-label">Calificación (0 al 10)</label>
                                <input name="rating" type="number" class="form-control" id="rating" placeholder="Ej. 3"
                                    min="0" max="10" required>
                            </div>

                            <!-- 6. Listened (Escuchado) -->
                            <div class="mb-4 form-check">
                                <input name="listened" type="checkbox" class="form-check-input" id="listened">
                                <label class="form-check-label" for="listened">¿Ya lo escuchaste?</label>
                            </div>

                            <!-- Botón de envío -->
                            <button name="submit" type="submit" class="btn btn-primary w-100 py-2">Guardar
                                Álbum</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: CARDS PARA ÁLBUMES -->
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body p-4">
                        <h3 class="card-title mb-4 text-primary">Álbumes Registrados</h3>

                        <!-- Contenedor donde irán tus cards (ejemplo estático de cómo luciría una) -->
                        <div class="d-flex flex-column gap-3">
                            <!-- CONTENEDOR VACÍO LISTO PARA EL BACKEND -->
                            <div class="d-flex flex-column gap-3">
                                <main id="album-container" class="d-flex flex-column gap-3">
                                    <!-- Aquí se inyectarán dinámicamente las cards de álbumes -->
                                </main>
                            </div>
                            <div class="text-center text-muted py-4">
                                <p class="mb-0">Los nuevos álbumes que registres aparecerán aquí.</p>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
